name: Checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check web/app.js
      - run: python -m pip install ruff==0.14.1
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q -x '/(\.venv[^/]*|\.export-work)/' .
      - run: bash -n run.sh setup.sh setup-rtsp.sh install-system-deps.sh hailo.sh
